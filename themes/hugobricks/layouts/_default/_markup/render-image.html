{{- if in (lower .Destination) ".svg" -}}
    <img src="{{ .Destination }}" alt="{{ .Text }}" class="is_svg" loading="lazy" decoding="async" />
{{- else -}}
    {{- $res := or (resources.GetMatch .Destination) (resources.Get (strings.TrimPrefix "/" .Destination)) -}}
    {{- if $res -}}
        {{- $fitted := $res.Fit `1200x1600 webp Smart q82` -}}
        <img src="{{ $fitted.RelPermalink }}" alt="{{ .Text }}" width="{{ $fitted.Width }}" height="{{ $fitted.Height }}" loading="lazy" decoding="async" />
    {{- else -}}
        <img src="{{ .Destination }}" alt="{{ .Text }}" loading="lazy" decoding="async" />
    {{- end -}}
{{- end -}}
