<div class="stats-grid">
{{- range $i := slice "stat1" "stat2" "stat3" "stat4" "stat5" "stat6" -}}
  {{- $val := index $.Params $i -}}
  {{- if $val -}}
    {{- $parts := split $val "|" -}}
    <div class="stat-card">
      <span class="stat-icon" aria-hidden="true">{{ index $parts 0 | htmlUnescape | safeHTML }}</span>
      <span class="stat-label">{{ index $parts 1 | htmlUnescape | safeHTML }}</span>
    </div>
  {{- end -}}
{{- end -}}
</div>
