server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    absolute_redirect off;
    port_in_redirect off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. 301 Redirects for language alias & legacy section URLs
    location = /en {
        return 301 /;
    }
    location = /en/ {
        return 301 /;
    }
    location = /projects/projects/ {
        return 301 /projects/;
    }
    location = /showcases/showcases/ {
        return 301 /showcases/;
    }
    location = /cn/projects/projects/ {
        return 301 /cn/projects/;
    }
    location = /cn/showcases/项目展示/ {
        return 301 /cn/showcases/;
    }

    # 2. 410 Gone for retired taxonomy, template partials, and theme demo pages
    location ~ ^/(cn/)?(tags|categories|bricks|blog|elements|get-started|sponsor|posts|docs|products|services|team|webshop|cart|faq|basic|basic2|headers|demo-[a-z-]+|header-[a-z-]+)(/|$) {
        return 410;
    }
    location ~ ^/(cn/)?images/?$ {
        return 410;
    }
    location ~ ^/(cn/)?showcases/(first-service|second-serice|third-serice)(/|$) {
        return 410;
    }

    # 3. Custom 404 handling (prevent /404/ and /cn/404/ from returning 200 Soft 404)
    error_page 404 /404/index.html;

    location = /404/index.html {
        internal;
    }
    location ^~ /404/ {
        return 404;
    }

    location = /cn/404/index.html {
        internal;
    }
    location ^~ /cn/404/ {
        error_page 404 /cn/404/index.html;
        return 404;
    }

    # 4. Static asset caching
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|webp|avif|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 5. Localized routing
    location /cn/ {
        error_page 404 /cn/404/index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
