baseURL: https://blazorserver.com/
theme: hugobricks
defaultContentLanguage: en
assetDir: static
disableKinds:
  - taxonomy
  - term
services:
  googleAnalytics: 
    id: G-2RBX6HT00W

markup:
  highlight:
    style: github-dark
  goldmark:
    renderer:
      unsafe: true
    extensions:
      extras:
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true

languages:
  en:
    contentDir: content/en
    weight: 1
    disabled: false
    permalinks:
      page:
        projects: /projects/:slug
        showcases: /showcases/:slug
      section:
        projects: /projects/
        showcases: /showcases/

  cn:
    contentDir: content/cn
    weight: 2
    disabled: false
    permalinks:
      page:
        projects: /projects/:slug
        showcases: /showcases/:slug
      section:
        projects: /projects/
        showcases: /showcases/
