- title: Engagement & Architecture FAQ
  faqs:
    - tag: Scope
      question: What types of enterprise projects does BlazorStudio specialize in?
      answer: >
        BlazorStudio specializes in custom **.NET 11 and Blazor** business applications, enterprise B2B integrations (BizTalk, SAP, Salesforce), and production AI Agent workflows. We have delivered [12+ enterprise systems](/showcases/) across manufacturing, workforce staffing, visitor compliance, CPQ quotation, logistics, and IoT operations.
    - tag: Integration
      question: Can you modernize legacy .NET systems or integrate with SAP, ERP, and hardware devices?
      answer: >
        Yes. We modernize legacy .NET Framework, WebForms, or monolithic applications incrementally into Clean Architecture on .NET 11 without disrupting daily operations, and integrate reliably with SAP, Salesforce, EDI pipelines, facial-recognition terminals, barcode printers, and NB-IoT field hardware.
    - tag: Ownership
      question: Do custom engagements include full source code and architecture documentation?
      answer: >
        Yes. Every custom engagement includes full source code ownership with zero vendor lock-in. Solutions are structured around Clean Architecture and CQRS with Docker configurations, CI/CD pipelines, and architecture documentation so your internal engineering team can own and extend the codebase long term.
    - tag: Tech Stack
      question: Which databases, frontend stacks, and hosting models are supported?
      answer: >
        Backends support PostgreSQL, SQL Server, and SQLite with .NET Aspire observability out of the box. Frontends can run on Blazor Server, Blazor WebAssembly PWA, or pair with React and WeChat Mini Program portals, deployed on-premises via private Docker or in the cloud.
    - tag: Delivery
      question: How are projects scoped, priced, and delivered across milestones?
      answer: >
        Instead of slow, traditional manual cycles, we use an **AI Multi-Agent collaborative engineering workflow** powered by pstack (architectural planning, multi-candidate racing, and strict diff interrogation). A senior architect directs architecture and review while coordinated AI agents accelerate scaffolding, API integration, and verification—compressing lead times and total cost while shipping verifiable increments every few days.
    - tag: Onboarding
      question: How do we start a project discussion or request an architecture review?
      answer: >
        Share your business context, current technology stack, or timeline goals via the [contact page](/contact/) or email `neo.js.cn@gmail.com`. After reviewing your goals, we provide a practical technical assessment, delivery options, and next steps.
