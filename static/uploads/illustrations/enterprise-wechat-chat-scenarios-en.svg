<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgChatEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#bgChatEn)"/>

  <!-- Header -->
  <text x="600" y="40" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">How the Assistant Behaves in Real Business Chats</text>
  <text x="600" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Polite Silence During Casual Talk, Separate Memory per Member, Recall Safety &amp; Zero Spam</text>

  <!-- Card 1: Precision @mention & Anti-Noise -->
  <rect x="36" y="92" width="356" height="532" rx="14" fill="#131c2e" stroke="#10b981" stroke-width="1.5"/>
  <rect x="36" y="92" width="356" height="58" rx="14" fill="#064e3b" fill-opacity="0.55"/>
  <text x="214" y="118" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">1. Only Speaks When @Mentioned</text>
  <text x="214" y="138" text-anchor="middle" fill="#a7f3d0" font-size="11.5">Never interrupts normal team conversation</text>

  <!-- Msg 1 -->
  <text x="58" y="176" fill="#94a3b8" font-size="11">Sales Rep (Casual Update)</text>
  <rect x="56" y="184" width="248" height="44" rx="10" fill="#1e293b"/>
  <text x="70" y="203" fill="#e2e8f0" font-size="12">Morning everyone, batch #42</text>
  <text x="70" y="220" fill="#e2e8f0" font-size="12">arrived at the Suzhou site.</text>
  <rect x="56" y="234" width="176" height="22" rx="6" fill="#334155"/>
  <text x="144" y="249" text-anchor="middle" fill="#94a3b8" font-size="10.5">Stays Quiet · No Interruption</text>

  <!-- Msg 2 -->
  <text x="58" y="280" fill="#94a3b8" font-size="11">Partner (Typed @all Notice)</text>
  <rect x="56" y="288" width="256" height="44" rx="10" fill="#1e293b"/>
  <text x="70" y="307" fill="#e2e8f0" font-size="12">@all Please confirm today's</text>
  <text x="70" y="324" fill="#e2e8f0" font-size="12">commissioning checklist.</text>
  <rect x="56" y="338" width="196" height="22" rx="6" fill="#334155"/>
  <text x="154" y="353" text-anchor="middle" fill="#94a3b8" font-size="10.5">Stays Quiet · Not a Bot Request</text>

  <!-- Msg 3 -->
  <text x="58" y="384" fill="#34d399" font-size="11">Client Engineer (Genuine @AI-Support)</text>
  <rect x="56" y="392" width="290" height="44" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="70" y="411" fill="#34d399" font-size="12" font-weight="600">@AI-Support <tspan fill="#f8fafc" font-weight="400">How do I troubleshoot</tspan></text>
  <text x="70" y="428" fill="#f8fafc" font-size="12">gateway error code E-402?</text>

  <!-- Bot Reply -->
  <text x="372" y="460" text-anchor="end" fill="#38bdf8" font-size="11">AI-Support (Instant SOP Answer)</text>
  <rect x="76" y="468" width="296" height="106" rx="10" fill="#065f46"/>
  <text x="90" y="490" fill="#a7f3d0" font-size="12" font-weight="600">@Client Engineer</text>
  <text x="90" y="510" fill="#ecfdf5" font-size="12">Error E-402 means RS-485 timeout:</text>
  <text x="90" y="528" fill="#ecfdf5" font-size="11.5">1. Verify 24V power &amp; A/B terminal wiring</text>
  <text x="90" y="546" fill="#ecfdf5" font-size="11.5">2. Check baud rate (9600 bps default)</text>
  <text x="90" y="564" fill="#a7f3d0" font-size="11">Source: Field Gateway Manual v3.2</text>

  <text x="214" y="604" text-anchor="middle" fill="#64748b" font-size="11">Long answers tag the requester on the opening part only</text>

  <!-- Card 2: Multi-User Session Isolation -->
  <rect x="422" y="92" width="356" height="532" rx="14" fill="#131c2e" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="422" y="92" width="356" height="58" rx="14" fill="#0c4a6e" fill-opacity="0.55"/>
  <text x="600" y="118" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="700">2. Parallel Questions Never Mix</text>
  <text x="600" y="138" text-anchor="middle" fill="#bae6fd" font-size="11.5">Dedicated memory for each member in the group</text>

  <!-- User A -->
  <text x="444" y="176" fill="#38bdf8" font-size="11">Member A · Procurement Manager</text>
  <rect x="442" y="184" width="296" height="44" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="456" y="203" fill="#38bdf8" font-size="12" font-weight="600">@AI-Support <tspan fill="#f8fafc" font-weight="400">Check delivery status for</tspan></text>
  <text x="456" y="220" fill="#f8fafc" font-size="12">purchase order PO-2026-108.</text>

  <!-- User B -->
  <text x="444" y="252" fill="#a5b4fc" font-size="11">Member B · Maintenance Tech (3s later)</text>
  <rect x="442" y="260" width="296" height="44" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="456" y="279" fill="#a5b4fc" font-size="12" font-weight="600">@AI-Support <tspan fill="#f8fafc" font-weight="400">What is the torque spec</tspan></text>
  <text x="456" y="296" fill="#f8fafc" font-size="12">for flange valve DN80?</text>

  <!-- Bot Reply A -->
  <text x="758" y="328" text-anchor="end" fill="#38bdf8" font-size="11">Separate Thread for Member A</text>
  <rect x="462" y="336" width="296" height="72" rx="10" fill="#0f3a54" stroke="#0284c7" stroke-width="1"/>
  <text x="476" y="357" fill="#7dd3fc" font-size="12" font-weight="600">@Member A (Procurement)</text>
  <text x="476" y="376" fill="#f0f9ff" font-size="11.5">PO-2026-108 is packed &amp; dispatched.</text>
  <text x="476" y="394" fill="#bae6fd" font-size="11.5">ETA: Nov 16, 14:00 (Synced with ERP)</text>

  <!-- Bot Reply B -->
  <text x="758" y="432" text-anchor="end" fill="#a5b4fc" font-size="11">Separate Thread for Member B</text>
  <rect x="462" y="440" width="296" height="72" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="476" y="461" fill="#c7d2fe" font-size="12" font-weight="600">@Member B (Maintenance)</text>
  <text x="476" y="480" fill="#eef2ff" font-size="11.5">DN80 flange recommended torque:</text>
  <text x="476" y="498" fill="#c7d2fe" font-size="11.5">65–75 N·m (cross-tighten sequence)</text>

  <!-- Footer Note -->
  <rect x="442" y="534" width="316" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="600" y="558" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-weight="600">Zero Conversation Mix-Ups</text>
  <text x="600" y="578" text-anchor="middle" fill="#94a3b8" font-size="11">Follow-ups from Member A stay strictly on A's order</text>

  <!-- Card 3: Recall Interception & Idempotency -->
  <rect x="808" y="92" width="356" height="532" rx="14" fill="#131c2e" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="808" y="92" width="356" height="58" rx="14" fill="#78350f" fill-opacity="0.45"/>
  <text x="986" y="118" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="700">3. Recall Guard, No Spam &amp; Privacy</text>
  <text x="986" y="138" text-anchor="middle" fill="#fde68a" font-size="11.5">Built for High-Stakes Client Conversations</text>

  <!-- Recall Case -->
  <text x="830" y="176" fill="#fbbf24" font-size="11">Case A · Client Recalls Message in 2s</text>
  <rect x="828" y="184" width="316" height="92" rx="10" fill="#1e293b" stroke="#d97706" stroke-width="1"/>
  <text x="844" y="206" fill="#f8fafc" font-size="12">1. Client: "@AI-Support Send quote for..."</text>
  <text x="844" y="226" fill="#94a3b8" font-size="11.5">2. Client spots a typo &amp; recalls immediately</text>
  <text x="844" y="246" fill="#fbbf24" font-size="11.5" font-weight="600">3. Bot detects the recall and cancels its</text>
  <text x="844" y="264" fill="#fbbf24" font-size="11.5">   pending reply — zero awkward messages</text>

  <!-- Network Blip Case -->
  <text x="830" y="304" fill="#34d399" font-size="11">Case B · Brief Network Drop Mid-Reply</text>
  <rect x="828" y="312" width="316" height="128" rx="10" fill="#1e293b" stroke="#059669" stroke-width="1"/>
  <text x="844" y="334" fill="#f8fafc" font-size="12">1. Bot assigns a unique delivery ticket</text>
  <text x="844" y="354" fill="#f8fafc" font-size="12">2. Network drops before confirmation arrives</text>
  <text x="844" y="374" fill="#38bdf8" font-size="11.5" font-weight="600">3. Checks delivery status first — never</text>
  <text x="844" y="394" fill="#34d399" font-size="11.5">   blindly resends the message again</text>
  <text x="844" y="414" fill="#94a3b8" font-size="11">Result: Client group gets exactly 1 reply</text>

  <!-- Privacy Badge -->
  <text x="830" y="468" fill="#a5b4fc" font-size="11">Case C · Commercial Privacy Protection</text>
  <rect x="828" y="476" width="316" height="116" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
  <text x="986" y="502" text-anchor="middle" fill="#e0e7ff" font-size="12.5" font-weight="600">What Stays Out of Local Storage:</text>
  <text x="986" y="524" text-anchor="middle" fill="#34d399" font-size="11.5">✗ Client chat bodies are NEVER saved</text>
  <text x="986" y="544" text-anchor="middle" fill="#34d399" font-size="11.5">✗ Access keys never appear in log files</text>
  <text x="986" y="568" text-anchor="middle" fill="#94a3b8" font-size="11">Only lightweight delivery receipts are tracked</text>
</svg>
