<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgFlowEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrGEn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrBEn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrAEn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrREn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" rx="16" fill="url(#bgFlowEn)"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">End-to-End Message Flow &amp; Idempotent State Machine</text>
  <text x="600" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Phase 1: Inbound SSE Stream, Live Filtering &amp; Atomic Deduplication  |  Phase 2: Outbound Idempotent Delivery &amp; Receipt Polling</text>

  <!-- ==================== PHASE 1: INBOUND ==================== -->
  <rect x="30" y="88" width="1140" height="270" rx="12" fill="#1e293b" fill-opacity="0.45" stroke="#10b981" stroke-width="1.5"/>
  <rect x="46" y="102" width="340" height="28" rx="6" fill="#065f46"/>
  <text x="216" y="121" text-anchor="middle" fill="#ecfdf5" font-size="13" font-weight="700">Phase 1: Inbound Event Reception &amp; Atomic Deduplication</text>

  <!-- Step 1 -->
  <rect x="48" y="148" width="195" height="115" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
  <circle cx="72" cy="172" r="12" fill="#10b981"/>
  <text x="72" y="177" text-anchor="middle" fill="#0b1120" font-size="12" font-weight="800">1</text>
  <text x="92" y="177" fill="#f8fafc" font-size="13" font-weight="700">SSE Event Stream</text>
  <text x="62" y="202" fill="#cbd5e1" font-size="11">• Subscribe /v1/events/stream</text>
  <text x="62" y="220" fill="#cbd5e1" font-size="11">• Verify /v1/status.serverId</text>
  <text x="62" y="238" fill="#34d399" font-size="11">• Receive message.committed</text>

  <path d="M 243 205 L 275 205" stroke="#10b981" stroke-width="2" marker-end="url(#arrGEn)"/>

  <!-- Step 2 -->
  <rect x="278" y="148" width="205" height="115" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
  <circle cx="302" cy="172" r="12" fill="#10b981"/>
  <text x="302" y="177" text-anchor="middle" fill="#0b1120" font-size="12" font-weight="800">2</text>
  <text x="322" y="177" fill="#f8fafc" font-size="13" font-weight="700">Fetch &amp; Live Filter</text>
  <text x="292" y="202" fill="#cbd5e1" font-size="11">• GET /messages/{messageId}</text>
  <text x="292" y="220" fill="#cbd5e1" font-size="11">• Require origin == "live" text</text>
  <text x="292" y="238" fill="#cbd5e1" font-size="11">• 5-min window (±60s clock skew)</text>

  <path d="M 483 205 L 515 205" stroke="#10b981" stroke-width="2" marker-end="url(#arrGEn)"/>

  <!-- Step 3 -->
  <rect x="518" y="148" width="205" height="115" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
  <circle cx="542" cy="172" r="12" fill="#10b981"/>
  <text x="542" y="177" text-anchor="middle" fill="#0b1120" font-size="12" font-weight="800">3</text>
  <text x="562" y="177" fill="#f8fafc" font-size="13" font-weight="700">Access &amp; Trigger Rules</text>
  <text x="532" y="202" fill="#cbd5e1" font-size="11">• Private toggle &amp; allowed_users</text>
  <text x="532" y="220" fill="#cbd5e1" font-size="11">• Group whitelist allowed_groups</text>
  <text x="532" y="238" fill="#34d399" font-size="11">• Group mode: true @mention / all</text>

  <path d="M 723 205 L 755 205" stroke="#10b981" stroke-width="2" marker-end="url(#arrGEn)"/>

  <!-- Step 4 -->
  <rect x="758" y="148" width="200" height="115" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="782" cy="172" r="12" fill="#38bdf8"/>
  <text x="782" y="177" text-anchor="middle" fill="#0b1120" font-size="12" font-weight="800">4</text>
  <text x="802" y="177" fill="#f8fafc" font-size="13" font-weight="700">Atomic SQLite Commit</text>
  <text x="772" y="202" fill="#cbd5e1" font-size="11">• Ensure messageId is unseen</text>
  <text x="772" y="220" fill="#38bdf8" font-size="11">• Record status = "queued"</text>
  <text x="772" y="238" fill="#38bdf8" font-size="11">• Advance SSE cursor atomically</text>

  <path d="M 958 205 L 988 205" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBEn)"/>

  <!-- Step 5 -->
  <rect x="990" y="148" width="160" height="115" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="1014" cy="172" r="12" fill="#818cf8"/>
  <text x="1014" y="177" text-anchor="middle" fill="#0b1120" font-size="12" font-weight="800">5</text>
  <text x="1034" y="177" fill="#f8fafc" font-size="13" font-weight="700">AstrBot LLM</text>
  <text x="1004" y="202" fill="#cbd5e1" font-size="11">• Isolate/share session</text>
  <text x="1004" y="220" fill="#cbd5e1" font-size="11">• Run LLM &amp; plugin tools</text>
  <text x="1004" y="238" fill="#a5b4fc" font-size="11">• Emit reply text chunks</text>

  <!-- Filtered / Recalled Note in Phase 1 -->
  <rect x="278" y="282" width="680" height="56" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="618" y="305" text-anchor="middle" fill="#94a3b8" font-size="12">
    <tspan fill="#fbbf24" font-weight="600">Filtered or Recalled Branch:</tspan> Historical imports, stale (&gt;5m), non-whitelisted, or unmentioned messages → marked <tspan fill="#e2e8f0" font-weight="600">ignored</tspan> &amp; cursor advances;
  </text>
  <text x="618" y="325" text-anchor="middle" fill="#94a3b8" font-size="12">
    Recall events immediately cancel active AstrBot events and mark the record <tspan fill="#fbbf24" font-weight="600">recalled</tspan> to prevent late replies.
  </text>

  <!-- ==================== PHASE 2: OUTBOUND ==================== -->
  <rect x="30" y="382" width="1140" height="350" rx="12" fill="#1e293b" fill-opacity="0.45" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="46" y="396" width="365" height="28" rx="6" fill="#0369a1"/>
  <text x="228" y="415" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="700">Phase 2: Outbound Idempotent Delivery &amp; Receipt State Machine</text>

  <!-- Connector from Step 5 to Step 6 -->
  <path d="M 1070 263 L 1070 368 L 145 368 L 145 438" stroke="#818cf8" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrBEn)"/>

  <!-- Step 6 -->
  <rect x="48" y="442" width="195" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="72" cy="466" r="12" fill="#38bdf8"/>
  <text x="72" y="471" text-anchor="middle" fill="#0b1120" font-size="12" font-weight="800">6</text>
  <text x="92" y="471" fill="#f8fafc" font-size="13" font-weight="700">Pre-Send Re-Check</text>
  <text x="62" y="496" fill="#cbd5e1" font-size="11">• Re-fetch msg to check recall</text>
  <text x="62" y="514" fill="#cbd5e1" font-size="11">• Empty output → no_reply</text>
  <text x="62" y="532" fill="#38bdf8" font-size="11">• Auto-@sender on 1st chunk</text>

  <path d="M 243 502 L 275 502" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBEn)"/>

  <!-- Step 7 -->
  <rect x="278" y="442" width="210" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="302" cy="466" r="12" fill="#38bdf8"/>
  <text x="302" y="471" text-anchor="middle" fill="#0b1120" font-size="12" font-weight="800">7</text>
  <text x="322" y="471" fill="#f8fafc" font-size="13" font-weight="700">Persist Key &amp; Single POST</text>
  <text x="292" y="496" fill="#cbd5e1" font-size="11">• Generate Idempotency-Key</text>
  <text x="292" y="514" fill="#cbd5e1" font-size="11">• Save key in SQLite sends table</text>
  <text x="292" y="532" fill="#34d399" font-size="11" font-weight="600">• Submit exactly one POST /sends</text>

  <path d="M 488 502 L 520 502" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBEn)"/>

  <!-- Step 8 -->
  <rect x="523" y="442" width="225" height="120" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="547" cy="466" r="12" fill="#fbbf24"/>
  <text x="547" y="471" text-anchor="middle" fill="#0b1120" font-size="12" font-weight="800">8</text>
  <text x="567" y="471" fill="#f8fafc" font-size="13" font-weight="700">Receipt Polling &amp; Recovery</text>
  <text x="537" y="496" fill="#cbd5e1" font-size="11">• queued / submitting: bounded poll</text>
  <text x="537" y="514" fill="#fbbf24" font-size="11">• Timeout / 408 / 429 / 5xx: NO re-POST</text>
  <text x="537" y="532" fill="#cbd5e1" font-size="11">• Query GET by send_id or original key</text>

  <!-- Branches to Final States -->
  <path d="M 748 470 L 800 450" stroke="#10b981" stroke-width="2" marker-end="url(#arrGEn)"/>
  <path d="M 748 502 L 800 525" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrAEn)"/>
  <path d="M 748 535 L 800 600" stroke="#f87171" stroke-width="2" marker-end="url(#arrREn)"/>

  <!-- State Outcome 1: Replied -->
  <rect x="805" y="418" width="340" height="62" rx="8" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-width="1.5"/>
  <text x="822" y="442" fill="#34d399" font-size="13" font-weight="700">✓ Receipt accepted → Status: replied</text>
  <text x="822" y="464" fill="#d1fae5" font-size="11">WeChat server accepted the segment; proceed to next segment if any</text>

  <!-- State Outcome 2: Partial / Failed -->
  <rect x="805" y="494" width="340" height="62" rx="8" fill="#78350f" fill-opacity="0.5" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="822" y="518" fill="#fbbf24" font-size="13" font-weight="700">! Subsequent Chunk Error → Status: partial / failed</text>
  <text x="822" y="540" fill="#fef3c7" font-size="11">Preserves segment receipts and halts remaining chunks to prevent spam</text>

  <!-- State Outcome 3: Needs Review -->
  <rect x="805" y="570" width="340" height="68" rx="8" fill="#7f1d1d" fill-opacity="0.5" stroke="#f87171" stroke-width="1.5"/>
  <text x="822" y="594" fill="#fca5a5" font-size="13" font-weight="700">⚠ Uncertain / Restarted Queue → Status: needs_review</text>
  <text x="822" y="614" fill="#fee2e2" font-size="11">Unknown receipt, ID mismatch, or crash during delivery—never auto-resent</text>
  <text x="822" y="630" fill="#fecaca" font-size="10">Inspect via sqlite3 -readonly and Native GET receipt endpoints</text>

  <!-- Bottom Guarantee Banner -->
  <rect x="48" y="654" width="1097" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="596" y="678" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">
    Core Safety Boundary: Pause for human review (needs_review) rather than blindly re-sending messages on timeout or restart
  </text>
  <text x="596" y="699" text-anchor="middle" fill="#94a3b8" font-size="11">
    SQLite stores only messageId / threadId / serverId / cursor / Idempotency-Key / state — zero chat bodies persisted to disk
  </text>
</svg>
