<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="25%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="78%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="hubHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="pillShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Light Studio Backdrop -->
  <rect width="1200" height="760" rx="24" fill="url(#studioBg)"/>
  <rect width="1200" height="760" rx="24" fill="url(#blueGlow)"/>
  <rect width="1200" height="760" rx="24" fill="url(#greenGlow)"/>

  <!-- Subtle Background Grid Dots -->
  <g fill="#cbd5e1" opacity="0.45">
    <circle cx="90" cy="90" r="2"/><circle cx="150" cy="90" r="2"/><circle cx="210" cy="90" r="2"/>
    <circle cx="90" cy="150" r="2"/><circle cx="150" cy="150" r="2"/><circle cx="210" cy="150" r="2"/>
    <circle cx="990" cy="610" r="2"/><circle cx="1050" cy="610" r="2"/><circle cx="1110" cy="610" r="2"/>
    <circle cx="990" cy="670" r="2"/><circle cx="1050" cy="670" r="2"/><circle cx="1110" cy="670" r="2"/>
  </g>

  <!-- Main Back Monitor / AstrBot Panel -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="96" width="530" height="440" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Window Top Bar -->
    <path d="M 70 116 Q 70 96 90 96 L 580 96 Q 600 96 600 116 L 600 152 L 70 152 Z" fill="url(#hubHeader)"/>
    <circle cx="102" cy="124" r="6" fill="#f87171"/>
    <circle cx="122" cy="124" r="6" fill="#fbbf24"/>
    <circle cx="142" cy="124" r="6" fill="#34d399"/>
    <text x="174" y="129" fill="#f8fafc" font-size="15" font-weight="700">AstrBot · WeChat Native</text>
    <rect x="466" y="111" width="110" height="26" rx="13" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <circle cx="484" cy="124" r="4.5" fill="#34d399"/>
    <text x="496" y="129" fill="#d1fae5" font-size="12" font-weight="600">Connected</text>

    <!-- Inside AstrBot Panel: AI Core & Capabilities -->
    <!-- Top Row: 3 Mini Cards -->
    <rect x="98" y="176" width="146" height="84" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="126" cy="204" r="14" fill="#2563eb"/>
    <text x="126" y="209" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">AI</text>
    <text x="150" y="208" fill="#1e3a8a" font-size="13" font-weight="700">LLM Hub</text>
    <text x="114" y="238" fill="#475569" font-size="11.5">RAG + Personas</text>

    <rect x="262" y="176" width="146" height="84" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <circle cx="290" cy="204" r="14" fill="#10b981"/>
    <text x="290" y="209" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">@</text>
    <text x="314" y="208" fill="#064e3b" font-size="13" font-weight="700">SSE Stream</text>
    <text x="278" y="238" fill="#475569" font-size="11.5">Cursor Recovery</text>

    <rect x="426" y="176" width="146" height="84" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="454" cy="204" r="14" fill="#4f46e5"/>
    <path d="M 448 204 L 452 208 L 461 199" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="478" y="208" fill="#312e81" font-size="13" font-weight="700">Idempotent</text>
    <text x="442" y="238" fill="#475569" font-size="11.5">SQLite Atomic Tx</text>

    <!-- Middle Chart / Stream Area -->
    <rect x="98" y="282" width="474" height="128" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="120" y="310" fill="#0f172a" font-size="13" font-weight="700">Direct /v1 API Pipeline (No Bridge)</text>
    <text x="550" y="310" text-anchor="end" fill="#10b981" font-size="12" font-weight="600">Live &lt; 5m Window</text>
    <!-- Smooth Telemetry Wave -->
    <path d="M 120 380 C 175 340, 215 390, 275 350 C 335 310, 385 375, 445 335 C 495 305, 525 330, 550 322" fill="none" stroke="url(#streamGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="275" cy="350" r="5" fill="#2563eb"/>
    <circle cx="445" cy="335" r="5" fill="#06b6d4"/>
    <circle cx="550" cy="322" r="5.5" fill="#10b981"/>

    <!-- Bottom Status Chips inside Panel -->
    <rect x="98" y="432" width="228" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="118" y="460" fill="#0f172a" font-size="13" font-weight="700">Whitelist Governance</text>
    <text x="118" y="484" fill="#64748b" font-size="11.5">allowed_users &amp; allowed_groups</text>

    <rect x="344" y="432" width="228" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="364" y="460" fill="#0f172a" font-size="13" font-weight="700">Zero-Text Local State</text>
    <text x="364" y="484" fill="#64748b" font-size="11.5">Never persists chat body or tokens</text>
  </g>

  <!-- Flowing Connection Bridge (Center) -->
  <path d="M 600 280 C 660 280, 675 310, 728 310" fill="none" stroke="url(#streamGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 600 320 C 660 320, 675 350, 728 350" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,6" stroke-linecap="round"/>
  <circle cx="600" cy="280" r="6" fill="#2563eb"/>
  <circle cx="728" cy="310" r="6" fill="#10b981"/>

  <!-- Floating Bridge Pill -->
  <g filter="url(#pillShadow)">
    <rect x="572" y="216" width="184" height="44" rx="22" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="598" cy="238" r="8" fill="#10b981"/>
    <text x="615" y="243" fill="#0f172a" font-size="12.5" font-weight="700">Loopback /v1 API</text>
  </g>

  <!-- Right Card: WeChat Group & Private Chat UI -->
  <g filter="url(#cardShadow)">
    <rect x="728" y="138" width="402" height="516" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Chat Header -->
    <path d="M 728 162 Q 728 138 752 138 L 1106 138 Q 1130 138 1130 162 L 1130 202 L 728 202 Z" fill="#f8fafc"/>
    <line x1="728" y1="202" x2="1130" y2="202" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="764" cy="170" r="14" fill="#10b981"/>
    <text x="764" y="175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">@</text>
    <text x="790" y="169" fill="#0f172a" font-size="14.5" font-weight="700">WeChat Group &amp; DM</text>
    <text x="790" y="187" fill="#64748b" font-size="11.5">unique_session · Per-User Context</text>

    <!-- Chat Bubble 1 (Member A) -->
    <circle cx="764" cy="244" r="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="764" y="249" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">A</text>
    <rect x="792" y="222" width="290" height="56" rx="14" fill="#f1f5f9"/>
    <text x="810" y="245" fill="#059669" font-size="12.5" font-weight="700">@AI-Assistant <tspan fill="#334155" font-weight="400">Check status for</tspan></text>
    <text x="810" y="264" fill="#334155" font-size="12.5">order PO-2026-108</text>

    <!-- Bot Reply Bubble 1 -->
    <rect x="780" y="294" width="302" height="72" rx="14" fill="#10b981"/>
    <text x="798" y="317" fill="#ecfdf5" font-size="12.5" font-weight="700">@Member A</text>
    <text x="798" y="337" fill="#ffffff" font-size="12.5">Dispatched via SF-Freight.</text>
    <text x="798" y="355" fill="#d1fae5" font-size="11.5">ETA: Nov 16, 14:00 (Verified once ✓)</text>
    <circle cx="1102" cy="314" r="14" fill="#0f172a"/>
    <text x="1102" y="319" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">AI</text>

    <!-- Chat Bubble 2 (Member B Isolated) -->
    <circle cx="764" cy="404" r="16" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="764" y="409" text-anchor="middle" fill="#6d28d9" font-size="12" font-weight="700">B</text>
    <rect x="792" y="384" width="290" height="52" rx="14" fill="#f1f5f9"/>
    <text x="810" y="406" fill="#059669" font-size="12.5" font-weight="700">@AI-Assistant <tspan fill="#334155" font-weight="400">Error E-402 steps?</tspan></text>
    <text x="810" y="424" fill="#64748b" font-size="11">Isolated session · Never mixes with A</text>

    <!-- Bot Reply Bubble 2 -->
    <rect x="780" y="452" width="302" height="68" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="798" y="475" fill="#065f46" font-size="12.5" font-weight="700">@Member B</text>
    <text x="798" y="495" fill="#064e3b" font-size="12">1. Check 24V power &amp; RS-485 wiring</text>
    <text x="798" y="511" fill="#047857" font-size="11">Recall-safe &amp; single-delivery guaranteed</text>

    <!-- Input Bar Bottom -->
    <rect x="752" y="544" width="354" height="44" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="776" y="571" fill="#94a3b8" font-size="12.5">Type @mention in approved group...</text>
    <circle cx="1082" cy="566" r="15" fill="#10b981"/>
    <path d="M 1076 566 L 1088 566 M 1083 561 L 1088 566 L 1083 571" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Security Footer inside Chat Card -->
    <rect x="752" y="602" width="354" height="34" rx="10" fill="#f0fdf4"/>
    <text x="929" y="623" text-anchor="middle" fill="#047857" font-size="11.5" font-weight="600">✓ Zero Chat Body Saved   ·   ✓ No Replay Storms</text>
  </g>

  <!-- Floating Bottom-Left Trust Card -->
  <g filter="url(#pillShadow)">
    <rect x="112" y="566" width="446" height="92" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="160" cy="612" r="24" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <path d="M 150 612 L 157 619 L 172 604" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="202" y="604" fill="#0f172a" font-size="15" font-weight="700">Reliable Pure-Text WeChat Automation</text>
    <text x="202" y="628" fill="#64748b" font-size="12.5">Private Linux Docker · Recall Guard · Idempotent Receipts</text>
  </g>
</svg>
