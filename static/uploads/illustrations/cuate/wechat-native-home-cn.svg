<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="studioBgCn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <radialGradient id="blueGlowCn" cx="25%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlowCn" cx="78%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streamGradCn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="hubHeaderCn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cardShadowCn" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="pillShadowCn" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Light Studio Backdrop -->
  <rect width="1200" height="760" rx="24" fill="url(#studioBgCn)"/>
  <rect width="1200" height="760" rx="24" fill="url(#blueGlowCn)"/>
  <rect width="1200" height="760" rx="24" fill="url(#greenGlowCn)"/>

  <!-- Subtle Background Grid Dots -->
  <g fill="#cbd5e1" opacity="0.45">
    <circle cx="90" cy="90" r="2"/><circle cx="150" cy="90" r="2"/><circle cx="210" cy="90" r="2"/>
    <circle cx="90" cy="150" r="2"/><circle cx="150" cy="150" r="2"/><circle cx="210" cy="150" r="2"/>
    <circle cx="990" cy="610" r="2"/><circle cx="1050" cy="610" r="2"/><circle cx="1110" cy="610" r="2"/>
    <circle cx="990" cy="670" r="2"/><circle cx="1050" cy="670" r="2"/><circle cx="1110" cy="670" r="2"/>
  </g>

  <!-- Main Back Monitor / AstrBot Panel -->
  <g filter="url(#cardShadowCn)">
    <rect x="70" y="96" width="530" height="440" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Window Top Bar -->
    <path d="M 70 116 Q 70 96 90 96 L 580 96 Q 600 96 600 116 L 600 152 L 70 152 Z" fill="url(#hubHeaderCn)"/>
    <circle cx="102" cy="124" r="6" fill="#f87171"/>
    <circle cx="122" cy="124" r="6" fill="#fbbf24"/>
    <circle cx="142" cy="124" r="6" fill="#34d399"/>
    <text x="174" y="129" fill="#f8fafc" font-size="15" font-weight="700">AstrBot · WeChat Native</text>
    <rect x="466" y="111" width="110" height="26" rx="13" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <circle cx="484" cy="124" r="4.5" fill="#34d399"/>
    <text x="496" y="129" fill="#d1fae5" font-size="12" font-weight="600">已连接在线</text>

    <!-- Inside AstrBot Panel: Top Row 3 Mini Cards -->
    <rect x="98" y="176" width="146" height="84" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="126" cy="204" r="14" fill="#2563eb"/>
    <text x="126" y="209" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">AI</text>
    <text x="148" y="208" fill="#1e3a8a" font-size="13" font-weight="700">智能中枢</text>
    <text x="114" y="238" fill="#475569" font-size="11.5">知识库 + 人设路由</text>

    <rect x="262" y="176" width="146" height="84" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <circle cx="290" cy="204" r="14" fill="#10b981"/>
    <text x="290" y="209" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">@</text>
    <text x="312" y="208" fill="#064e3b" font-size="13" font-weight="700">SSE 事件流</text>
    <text x="278" y="238" fill="#475569" font-size="11.5">断线游标无损恢复</text>

    <rect x="426" y="176" width="146" height="84" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="454" cy="204" r="14" fill="#4f46e5"/>
    <path d="M 448 204 L 452 208 L 461 199" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="476" y="208" fill="#312e81" font-size="13" font-weight="700">幂等交付</text>
    <text x="442" y="238" fill="#475569" font-size="11.5">SQLite 原子防重发</text>

    <!-- Middle Chart / Stream Area -->
    <rect x="98" y="282" width="474" height="128" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="120" y="310" fill="#0f172a" font-size="13" font-weight="700">直连 /v1 API 通道（无需额外 Bridge）</text>
    <text x="550" y="310" text-anchor="end" fill="#10b981" font-size="12" font-weight="600">5 分钟实时窗口</text>
    <!-- Smooth Telemetry Wave -->
    <path d="M 120 380 C 175 340, 215 390, 275 350 C 335 310, 385 375, 445 335 C 495 305, 525 330, 550 322" fill="none" stroke="url(#streamGradCn)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="275" cy="350" r="5" fill="#2563eb"/>
    <circle cx="445" cy="335" r="5" fill="#06b6d4"/>
    <circle cx="550" cy="322" r="5.5" fill="#10b981"/>

    <!-- Bottom Status Chips inside Panel -->
    <rect x="98" y="432" width="228" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="118" y="460" fill="#0f172a" font-size="13" font-weight="700">双白名单权限控制</text>
    <text x="118" y="484" fill="#64748b" font-size="11.5">精准限定授权用户与微信群</text>

    <rect x="344" y="432" width="228" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="364" y="460" fill="#0f172a" font-size="13" font-weight="700">聊天正文零落盘</text>
    <text x="364" y="484" fill="#64748b" font-size="11.5">状态库与日志不保存消息正文</text>
  </g>

  <!-- Flowing Connection Bridge (Center) -->
  <path d="M 600 280 C 660 280, 675 310, 728 310" fill="none" stroke="url(#streamGradCn)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 600 320 C 660 320, 675 350, 728 350" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,6" stroke-linecap="round"/>
  <circle cx="600" cy="280" r="6" fill="#2563eb"/>
  <circle cx="728" cy="310" r="6" fill="#10b981"/>

  <!-- Floating Bridge Pill -->
  <g filter="url(#pillShadowCn)">
    <rect x="572" y="216" width="184" height="44" rx="22" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="598" cy="238" r="8" fill="#10b981"/>
    <text x="615" y="243" fill="#0f172a" font-size="12.5" font-weight="700">本地回环 /v1 API</text>
  </g>

