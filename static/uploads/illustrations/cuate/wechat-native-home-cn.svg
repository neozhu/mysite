    <rect x="728" y="138" width="402" height="516" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Chat Header -->
    <path d="M 728 162 Q 728 138 752 138 L 1106 138 Q 1130 138 1130 162 L 1130 202 L 728 202 Z" fill="#f8fafc"/>
    <line x1="728" y1="202" x2="1130" y2="202" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="764" cy="170" r="14" fill="#10b981"/>
    <text x="764" y="175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">@</text>
    <text x="790" y="169" fill="#0f172a" font-size="14.5" font-weight="700">微信群聊与私聊接入</text>
    <text x="790" y="187" fill="#64748b" font-size="11.5">同群按成员隔离上下文 · 不串台</text>

    <!-- Chat Bubble 1 (Member A) -->
    <circle cx="764" cy="244" r="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="764" y="249" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">林</text>
    <rect x="792" y="222" width="290" height="56" rx="14" fill="#f1f5f9"/>
    <text x="810" y="245" fill="#059669" font-size="12.5" font-weight="700">@AI助手 <tspan fill="#334155" font-weight="400">查一下采购单</tspan></text>
    <text x="810" y="264" fill="#334155" font-size="12.5">PO-2026-108 的发货进度</text>

    <!-- Bot Reply Bubble 1 -->
    <rect x="780" y="294" width="302" height="72" rx="14" fill="#10b981"/>
    <text x="798" y="317" fill="#ecfdf5" font-size="12.5" font-weight="700">@林经理</text>
    <text x="798" y="337" fill="#ffffff" font-size="12.5">已由顺丰快运打包发出，</text>
    <text x="798" y="355" fill="#d1fae5" font-size="11.5">预计明日 14:00 送达（仅回复一次 ✓）</text>
    <circle cx="1102" cy="314" r="14" fill="#0f172a"/>
    <text x="1102" y="319" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">AI</text>

    <!-- Chat Bubble 2 (Member B Isolated) -->
    <circle cx="764" cy="404" r="16" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="764" y="409" text-anchor="middle" fill="#6d28d9" font-size="12" font-weight="700">张</text>
    <rect x="792" y="384" width="290" height="52" rx="14" fill="#f1f5f9"/>
    <text x="810" y="406" fill="#059669" font-size="12.5" font-weight="700">@AI助手 <tspan fill="#334155" font-weight="400">网关 E-402 怎么查？</tspan></text>
    <text x="810" y="424" fill="#64748b" font-size="11">独立会话上下文 · 绝不混淆林经理订单</text>

    <!-- Bot Reply Bubble 2 -->
    <rect x="780" y="452" width="302" height="68" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="798" y="475" fill="#065f46" font-size="12.5" font-weight="700">@张工</text>
    <text x="798" y="495" fill="#064e3b" font-size="12">1. 检查 24V 供电与 RS-485 接线</text>
    <text x="798" y="511" fill="#047857" font-size="11">支持撤回即时拦截 · 幂等回执校验</text>

    <!-- Input Bar Bottom -->
    <rect x="752" y="544" width="354" height="44" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="776" y="571" fill="#94a3b8" font-size="12.5">在授权群内真正 @机器人 即可唤醒…</text>
    <circle cx="1082" cy="566" r="15" fill="#10b981"/>
    <path d="M 1076 566 L 1088 566 M 1083 561 L 1088 566 L 1083 571" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Security Footer inside Chat Card -->
    <rect x="752" y="602" width="354" height="34" rx="10" fill="#f0fdf4"/>
    <text x="929" y="623" text-anchor="middle" fill="#047857" font-size="11.5" font-weight="600">✓ 聊天正文零留存   ·   ✓ 重启不炸历史消息</text>
  </g>

  <!-- Floating Bottom-Left Trust Card -->
  <g filter="url(#pillShadowCn)">
    <rect x="112" y="566" width="446" height="92" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="160" cy="612" r="24" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <path d="M 150 612 L 157 619 L 172 604" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="202" y="604" fill="#0f172a" font-size="15" font-weight="700">高可靠纯文本微信智能接入</text>
    <text x="202" y="628" fill="#64748b" font-size="12.5">Docker 私有部署 · 撤回感知 · 幂等回执追踪</text>
  </g>
</svg>
